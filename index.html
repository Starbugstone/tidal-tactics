<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101c23"><meta name="description" content="Command a squad across three island battlefields in Tidal Tactics, a squad runner with automatic weapons and zombie hordes.">
<title>Tidal Tactics · Outbreak Campaign</title><link rel="icon" type="image/svg+xml" href="./src/art/emblem.svg">
</head><body>
<div class="console">
<header class="topbar">
  <div class="brand"><img src="./src/art/emblem.svg" alt=""><h1>TIDAL<span>TACTICS</span></h1></div>
  <div class="top-divider"></div><div class="campaign"><i></i>Outbreak campaign</div>
  <nav aria-label="Game controls"><button id="manualBtn" aria-label="Field manual" class="manual"><i data-icon="book"></i><span>Field manual</span></button><span class="nav-rule"></span><button id="sound" class="iconbtn" aria-label="Mute sound" title="Mute sound"><i data-icon="volume"></i></button><button id="expand" class="iconbtn" aria-label="Enter full screen" title="Enter full screen"><i data-icon="expand"></i></button></nav>
</header>
<main id="arena" data-state="ready" aria-label="Island battlefield">
  <canvas id="terrain" aria-hidden="true"></canvas>
  <canvas id="battlefield" aria-label="Drag to steer your squad or use the arrow keys. Soldiers fire automatically." tabindex="0"></canvas>
  <div class="shading"></div>
  <div class="mission"><div class="kicker"><span></span>Operation <b id="missionNo">01</b> / 03</div>
    <h2 id="missionName">Breakwater Bay</h2><div class="objective"><i data-icon="target"></i><span id="objective">Reach the coastal extraction zone</span></div>
  </div>
  <div class="status"><i class="status-dot"></i><span id="statusText">Awaiting deployment</span></div>
  <div id="combatHud" hidden><div class="meter"><span><i data-icon="flag"></i>Extraction <b id="distance"></b></span><div><i id="routeBar"></i></div></div></div>
  <div id="bossMeter" hidden><span id="bossName"></span><b id="bossHealth"></b><i><em></em></i></div>
  <div id="toast" role="status"></div>
  <div id="alertCard" aria-live="polite" hidden><img id="alertArt" alt=""><div><small id="alertTag"></small><strong id="alertTitle"></strong><span id="alertDetail"></span></div></div>
  <div class="field-corner left"><i data-icon="pointer"></i><span id="location">Drag to steer</span></div>
  <div class="field-corner right"><i data-icon="layers"></i><span id="biome">Coastal islands</span></div>
  <div id="loading">Preparing battlefield…</div>
</main>
<section class="deck" aria-label="Campaign operations">
 <div class="deck-left"><div class="deck-heading"><i data-icon="map"></i><h2>Operations</h2><span class="rule"></span><span class="deck-count" id="cleared">0 / 3 cleared</span></div><div id="levels" class="levels"></div></div>
 <div class="loadout" hidden id="loadout"><img id="gunArt" alt=""><div><small>Squad loadout</small><strong id="weaponName"></strong></div><div id="upgradeSteps" aria-label="Weapon progression"></div></div>
 <div class="action"><button id="deploy"><i data-icon="play"></i><span>Deploy squad</span></button><span class="hint"><i data-icon="pointer"></i>Drag to steer <b>·</b> Auto-fire</span></div>
</section>
</div>
<dialog id="dialog" aria-labelledby="dialogTitle"><div class="dialog-head"><div class="kicker"><span></span><b id="dialogTag">Field manual</b></div><button id="dialogClose" aria-label="Close dialog" class="iconbtn"><i data-icon="close"></i></button></div><h2 id="dialogTitle"></h2><div id="dialogBody"></div><div id="dialogActions"></div></dialog>
<script type="module" src="./src/main.js"></script></body></html>
